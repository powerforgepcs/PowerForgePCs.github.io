<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get a Quote | PowerForge PCs</title>
    <style>
        /* Global Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #070709;
            color: #f1f1f5;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Navigation Bar */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 6%;
            background-color: rgba(13, 13, 16, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: #38bdf8;
            letter-spacing: 1.5px;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .logo span {
            color: #ffffff;
        }

        nav {
            display: flex;
            gap: 28px;
            align-items: center;
        }

        nav a {
            color: #94a3b8;
            text-decoration: none;
            font-weight: 500;
            font-size: 14px;
            letter-spacing: 0.3px;
            transition: color 0.2s ease;
        }

        nav a:hover {
            color: #38bdf8;
        }

        /* Form Section Container */
        .quote-form-section {
            max-width: 640px;
            width: 90%;
            margin: 60px auto 100px auto;
            padding: 45px 40px;
            background: linear-gradient(145deg, #111116 0%, #0d0d10 100%);
            border-radius: 16px;
            border: 1px solid rgba(56, 189, 248, 0.15);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            flex-grow: 1;
        }

        .quote-form-section h2 {
            margin-top: 0;
            font-size: 28px;
            color: #ffffff;
            margin-bottom: 10px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }

        .quote-form-section h2 span {
            color: #38bdf8;
        }

        .quote-form-section p {
            color: #94a3b8;
            font-size: 15px;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        /* Form Element Styling */
        .form-group {
            margin-bottom: 22px;
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #e2e8f0;
            letter-spacing: 0.2px;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            padding: 13px 16px;
            background-color: #17171c;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            color: #ffffff;
            font-size: 15px;
            font-family: inherit;
            transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
        }

        .form-group input:hover,
        .form-group select:hover,
        .form-group textarea:hover {
            border-color: rgba(255, 255, 255, 0.15);
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: #38bdf8;
            background-color: #1a1a22;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
        }

        ::placeholder {
            color: #64748b;
        }

        .form-group select {
            cursor: pointer;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 110px;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(2, 132, 199, 0.35);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
            margin-top: 10px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(2, 132, 199, 0.5);
            background: linear-gradient(135deg, #0369a1 0%, #075985 100%);
        }

        .submit-btn:active {
            transform: translateY(0);
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 50px 6%;
            color: #64748b;
            font-size: 13.5px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            background-color: #050507;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">POWER<span>FORGE</span></a>
        <nav>
            <a href="index.html#services">Services & Pricing</a>
            <a href="index.html#gallery">Recent Builds</a>
        </nav>
    </header>

    <section class="quote-form-section">
        <h2>Request a Custom <span>Build</span></h2>
        <p>Tell me what you need, and I'll coordinate your build assembly and component selection.</p>
        
        <!-- Connected to Web3Forms Submission API -->
        <form action="https://api.web3forms.com/submit" method="POST">
            
            <!-- Hidden Access Key -->
            <input type="hidden" name="access_key" value="db7831c0-a938-437e-927b-af591e92d8e5">

            <div class="form-group">
                <label for="service-type">Service Required</label>
                <select id="service-type" name="service-type" required>
                    <option value="" disabled selected>Select service...</option>
                    <option value="full-build">Full Custom Build Service ($75 labor + parts)</option>
                    <option value="advanced-build">Advanced Build + OS/Tuning Package ($110)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="budget">What is your exact budget (AUD)?</label>
                <input type="number" id="budget" name="budget" placeholder="e.g. 1500" required>
            </div>

            <div class="form-group">
                <label for="use-case">What will you primarily use the PC for?</label>
                <select id="use-case" name="use-case" required>
                    <option value="" disabled selected>Select your main use...</option>
                    <option value="esports">Competitive Esports (Fortnite, Valorant, high FPS)</option>
                    <option value="aaa-gaming">4K / Heavy AAA Gaming (Cyberpunk, GTA, Max Settings)</option>
                    <option value="streaming-editing">Streaming / Video Editing / Content Creation</option>
                    <option value="general-school">General Use / Schoolwork / Light Gaming</option>
                </select>
            </div>

            <div class="form-group">
                <label for="aesthetic">Aesthetic Preference</label>
                <select id="aesthetic" name="aesthetic" required>
                    <option value="" disabled selected>Select a style...</option>
                    <option value="stealth-black">Stealth Black (No RGB, clean and quiet)</option>
                    <option value="all-white">All-White Build</option>
                    <option value="max-rgb">Maximum RGB (Flashy lights, customizable)</option>
                    <option value="performance-first">Performance First (All budget into specs, style doesn't matter)</option>
                </select>
            </div>

            <div class="form-group">
                <label for="notes">Any specific requirements or specific games you play?</label>
                <textarea id="notes" name="notes" rows="4" placeholder="e.g. Needs Wi-Fi, mostly playing Warzone, prefer AMD over NVIDIA..."></textarea>
            </div>

            <div class="form-group">
                <label for="email">Your Email Address</label>
                <input type="email" id="email" name="email" placeholder="name@example.com" required>
            </div>

            <button type="submit" class="submit-btn">Submit Request</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 PowerForge PCs. Expert Custom PC Consultation & Optimization.</p>
    </footer>

      <!-- JavaScript to autofill tier from URL parameter -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const tierParam = urlParams.get('tier');
            if (tierParam) {
                const serviceSelect = document.getElementById('service-type');
                if (serviceSelect) {
                    serviceSelect.value = tierParam;
                }
            }
        });
    </script>

</body>
</html>
